version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x rejects TypeScript >= 6.1; revisit when it supports TS 7.
      - dependency-name: typescript
        versions: [">=6.1"]
      # The app targets Node 24, so @types/node 26 is not useful yet.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
