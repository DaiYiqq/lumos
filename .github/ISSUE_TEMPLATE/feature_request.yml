name: ✨ Feature request
description: Suggest an idea or improvement (English or 中文)
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the **problem** first, then the proposed solution.
        For large changes, maintainers may ask for a design discussion before implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Example — "I have 2,000 PDFs and the document list is slow", "I want to share a cited answer".
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion / parsing
        - Retrieval / citations
        - Chat / AI providers
        - UI / UX / accessibility
        - i18n / translations
        - Performance
        - Packaging / installation
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this
          required: false
        - label: I checked the roadmap and existing issues first
          required: true
