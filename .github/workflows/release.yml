name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - label: Windows arm64
            platform: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: Linux x64
            platform: ubuntu-24.04
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lumos ${{ github.ref_name }}"
          releaseBody: |
            Lumos ${{ github.ref_name }} — local-first knowledge base with citation-grounded answers.

            ## Download / 下载

            | Platform | Installer |
            | --- | --- |
            | Windows x64 | `Lumos_*_x64-setup.exe` (NSIS) / `*_x64_en-US.msi` |
            | Windows arm64 | `Lumos_*_arm64-setup.exe` (NSIS) / `*_arm64_en-US.msi` |
            | macOS Apple Silicon | `Lumos_*_aarch64.dmg` |
            | Linux x64 | `Lumos_*_amd64.AppImage` / `.deb` / `.rpm` |

            Installers are unsigned; SmartScreen / Gatekeeper may warn on first launch.
            See the README for platform-specific installation steps.

            ## Languages / 语言
            [简体中文](https://github.com/DaiYiqq/lumos/blob/main/README.md) ·
            [English](https://github.com/DaiYiqq/lumos/blob/main/README.en.md) ·
            [繁體中文](https://github.com/DaiYiqq/lumos/blob/main/README.zh-TW.md) ·
            [日本語](https://github.com/DaiYiqq/lumos/blob/main/README.ja.md)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
