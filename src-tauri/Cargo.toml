[package]
name = "lumos"
version = "0.2.0"
description = "Lumos — local-first personal knowledge base with citation-grounded AI answers"
authors = ["DaiYi <1703205607@qq.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/DaiYiqq/lumos"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-store = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
pdf-extract = "0.12.1"
html2text = "0.17.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
walkdir = "2.5.0"
sha2 = "0.11.1"
notify = "8.2.0"
fastembed = { version = "7.1.1", default-features = false, features = [
    "ort-download-binaries-native-tls",
] }
sqlite-vec = "0.1.9"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "stream",
    "native-tls",
] }
keyring = "4.2.0"
async-trait = "0.1.92"
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
